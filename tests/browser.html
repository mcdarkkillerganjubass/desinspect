<!doctype html>
<meta charset="utf-8">
<title>Design Inspect browser checks</title>
<style>
  :root { font-size:16px; --space:24px; --ink:rgb(12, 34, 56); --font-ui:400 13px/20px sans-serif; --weight-strong:700; --clear:rgba(0,0,0,0); --very-long-color-variable-name-that-wraps:rgb(12,34,56); }
  #trigger { box-sizing:border-box; width:180px; height:100px; padding:var(--space); color:var(--ink); border:2px solid var(--ink); border-radius:0; margin:2rem; }
</style>
<button id="trigger">Open dropdown</button>
<div id="dropdown" hidden>Dropdown</div>
<div id="type-shorthand" style="font:var(--font-ui);color:var(--ink);background-color:var(--clear)">Typography</div>
<div id="type-override" style="font:var(--font-ui);font-weight:var(--weight-strong);background-color:#0000">Override</div>
<div id="alignment" style="color:var(--very-long-color-variable-name-that-wraps)">Alignment</div>
<pre id="result">Running</pre>
<script>
  const trigger = document.querySelector('#trigger'), dropdown = document.querySelector('#dropdown');
  trigger.addEventListener('blur', () => dropdown.hidden = true);
  document.addEventListener('pointerdown', event => {if (event.target !== trigger) dropdown.hidden = true;}, true);
  let inspectorRoot;
  const attach = Element.prototype.attachShadow;
  Element.prototype.attachShadow = function(options) {const shadow = attach.call(this,options); if(this.localName === 'design-inspect-overlay') inspectorRoot = shadow; return shadow;};
</script>
<script src="../design-tokens.js"></script>
<script src="../figma-icons.js"></script>
<script src="../geometry.js"></script>
<script src="../css-values.js"></script>
<script src="../layout-icons.js"></script>
<script src="../spacing.js"></script>
<script src="../box-model.js"></script>
<script src="../inspect.js"></script>
<script>
  Element.prototype.attachShadow = attach;
  const assert = (ok, message) => {if(!ok) throw Error(message);};
  const tick = () => new Promise(resolve => setTimeout(resolve, 100));
  const click = el => el.dispatchEvent(new MouseEvent('click',{bubbles:true,composed:true,cancelable:true}));
  let copiedText;
  Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async text=>{copiedText=text;}}});
  async function run() {
    click(trigger); await tick();
    const panel=inspectorRoot.querySelector('.panel');
    for(let attempt=0;attempt<30 && ![...document.fonts].some(face=>face.family==='Design Inspect Google Sans Code');attempt++)await tick();
    assert([...document.fonts].some(face=>face.family==='Design Inspect Google Sans Code' && face.status==='loaded'),'Bundled Google Sans Code is loaded');
    assert(getComputedStyle(panel).fontSize==='13px' && getComputedStyle(panel).lineHeight==='15.6px','13px / 120 percent panel typography');
    assert([...panel.querySelectorAll('*')].every(node=>parseFloat(getComputedStyle(node).fontSize)>=11),'11px minimum for all panel content');
    const inspectToggle=inspectorRoot.querySelector('.inspect-toggle');
    assert(inspectToggle.getAttribute('aria-label')==='Stop inspecting' && inspectToggle.querySelector('.inspect-state svg'),'Active inspect label and stop icon');
    const inspectLabel=inspectToggle.querySelector('.inspect-label svg');
    assert(inspectLabel.getAttribute('viewBox')==='0 0 58 20','Inspect retains Figma text line box');
    assert(inspectLabel.getBBox().y>4 && inspectLabel.getBBox().y<4.5,'Inspect ink baseline offset matches Figma');
    assert(inspectToggle.getBoundingClientRect().width===88 && inspectToggle.getBoundingClientRect().height===24,'Active inspect button is 88 by 24');
    const autoSelectorWidth=panel.querySelector('.settings-button').getBoundingClientRect().width;
    assert(panel.querySelector('.eyedropper-button').getBoundingClientRect().width===24,'Pipette button is 24px wide');

    click(inspectToggle);
    assert(inspectToggle.getAttribute('aria-pressed')==='false' && inspectToggle.querySelector('path'),'Paused inspect uses play icon');
    assert(inspectToggle.getBoundingClientRect().width===88 && inspectToggle.getBoundingClientRect().height===24,'Start and stop share the same button dimensions');
    assert(getComputedStyle(inspectToggle).paddingLeft==='6px','Start retains the shared button padding');
    click(inspectToggle);
    const settings=inspectorRoot.querySelector('.settings-button'),menu=inspectorRoot.querySelector('.settings-menu');
    click(settings);
    assert(!menu.hidden && settings.getAttribute('aria-expanded')==='true','Settings opens');
    assert([...menu.querySelectorAll('.settings-label')].map(n=>n.getAttribute('aria-label')).join(',')==='Units,Theme','Two settings sections');
    const remOption=menu.querySelector('[data-unit=rem]'),remBounds=remOption.getBoundingClientRect();
    remOption.dispatchEvent(new MouseEvent('pointerdown',{bubbles:true,composed:true,cancelable:true,clientX:remBounds.left+remBounds.width/2,clientY:remBounds.top+remBounds.height/2}));
    assert(!menu.hidden,'Pointerdown inside closed Shadow DOM must not dismiss settings');
    click(remOption);
    assert(!menu.hidden && inspectorRoot.querySelector('.unit-label').getAttribute('aria-label')==='rem','Unit selection updates summary and keeps menu open');
    assert(settings.getBoundingClientRect().width<autoSelectorWidth,'Selector shrinks to fit the shorter unit label');
    click(menu.querySelector('[data-theme-choice=light]'));
    assert(inspectorRoot.host.dataset.theme==='light' && !menu.hidden,'Theme selection applies without closing');
    click(menu.querySelector('[data-theme-choice=dark]'));
    assert(inspectorRoot.host.dataset.theme==='dark' && !menu.hidden,'Dark applies without closing');
    click(menu.querySelector('[data-theme-choice=system]'));
    assert(inspectorRoot.host.dataset.theme==='system' && !menu.hidden,'System applies without closing');
    click(menu.querySelector('[data-theme-choice=light]'));
    click(menu.querySelector('[data-unit=auto]'));
    settings.focus();await tick();assert(!menu.hidden,'Moving focus does not dismiss dropdown');
    assert(menu.getBoundingClientRect().width===270 && menu.getBoundingClientRect().height===124,'Exact dropdown dimensions');
    for(const option of menu.querySelectorAll('[data-theme-choice]')){assert(option.querySelectorAll('.figma-icon').length===2,'Theme option has an icon and label');assert(option.firstElementChild.getBoundingClientRect().width===16,'Theme glyph retains 16px size');}
    click(inspectToggle);assert(menu.hidden,'Other header control dismisses menu');click(inspectToggle);
    click(settings);click(trigger);assert(menu.hidden,'Outside click dismisses menu');
    click(settings);click(settings);assert(menu.hidden,'Trigger closes menu');
    assert(inspectorRoot.querySelector('.unit-select').options.length===4,'Four unit choices');
    const ordered=[...inspectorRoot.querySelector('.content').querySelectorAll('.box-model,.size-table,.property-group')].map(node=>node.dataset.group || (node.className==='box-model'?'box':'sizes'));
    assert(ordered.join(',')==='box,sizes,Appearance,Layout,Typography','Requested content order');
    assert(![...inspectorRoot.querySelectorAll('h3')].some(node=>node.textContent==='Appearance'),'Appearance title removed');
    const text = inspectorRoot.querySelector('.content').textContent;
    assert(text.includes('ink') && !text.includes('var(--') && text.includes('24px'), 'Clean variable names and computed descriptions');
    const preview=[...inspectorRoot.querySelectorAll('.color-preview')].find(node=>node.closest('.table-row')?.querySelector('.token'));
    assert(preview && preview.getBoundingClientRect().width===14 && preview.getBoundingClientRect().height===14 && getComputedStyle(preview).borderRadius==='50%', 'Shared 14px round color preview');
    const colorStack=preview.closest('.table-row');
    assert(colorStack.querySelector('.value-descriptions').hidden,'Computed variable descriptions hidden initially');
    assert(colorStack.querySelector('.value-toggle:not(.chain-toggle)').getAttribute('aria-expanded')==='false','Eye starts inactive');
    click(colorStack.querySelector('.value-toggle:not(.chain-toggle)'));
    assert(!colorStack.querySelector('.value-descriptions').hidden && colorStack.querySelector('.value-toggle:not(.chain-toggle)').getAttribute('aria-expanded')==='true','Eye reveals computed descriptions');
    assert(getComputedStyle(colorStack.querySelector('.value-toggle:not(.chain-toggle)')).color==='rgb(2, 71, 222)','Open description turns eye blue');
    assert(colorStack.querySelector('.token').getBoundingClientRect().left===colorStack.querySelector('.actual').getBoundingClientRect().left, 'Color description aligned with token text');
    assert(colorStack.querySelector('.actual').getBoundingClientRect().top>colorStack.querySelector('.token').getBoundingClientRect().top, 'Computed value beneath token');
    const chainAction=colorStack.querySelector('.chain-toggle');
    if(chainAction){
      click(chainAction);
      assert(chainAction.getAttribute('aria-expanded')==='true' && getComputedStyle(chainAction).color==='rgb(2, 71, 222)','Chain control changes color independently');
      assert(getComputedStyle(colorStack.querySelector('.value-descriptions')).borderTopWidth==='1px','Separator appears between two open descriptions');
      click(chainAction);
      assert(getComputedStyle(colorStack.querySelector('.value-descriptions')).borderTopWidth==='0px','Separator disappears when chain closes');
    }
    const actions=colorStack.querySelector('.value-actions').getBoundingClientRect(),valueBox=colorStack.querySelector('.table-value').getBoundingClientRect();
    assert(Math.abs(actions.right-(valueBox.right-12))<.1,'Actions align to far right of value row');

    const inkCopy=[...inspectorRoot.querySelectorAll('.token')].find(button=>button.textContent==='ink');
    inkCopy.scrollIntoView({block:'center'});
    click(inkCopy);await tick();
    assert(copiedText===undefined,'Variable clicks do not write to clipboard');
    inspectorRoot.querySelector('.content').scrollTop=0;
    const layoutNames=[...inspectorRoot.querySelectorAll('.layout-name')];
    assert(layoutNames.length===3 && layoutNames.every(label=>(label.getAttribute('aria-description')||'').length>10),'Applicable block-layout hints remain; flex-only values omitted');
    assert(!inspectorRoot.querySelector('.layout-name').parentElement.querySelector('dd svg'),'Layout values have no decorative icons');
    assert(text.includes('2rem'), 'Auto preserves authored units');
    assert(inspectorRoot.querySelectorAll('.box-layer').length === 3, 'Margin/stroke/padding in one diagram');
    assert(inspectorRoot.querySelector('.box-margin').getBoundingClientRect().height<200,'More compact box model');
    assert(inspectorRoot.querySelectorAll('.box-value').length === 12, 'Four values per layer');
    const side=inspectorRoot.querySelector('.box-padding .box-left'),number=side.querySelector('.box-number'),units=side.querySelector('.box-unit');
    assert(number.textContent==='24' && units.textContent==='px','Side units split from numbers');
    assert(units.getBoundingClientRect().top>=number.getBoundingClientRect().bottom,'Side units below numbers');
    assert(Math.abs((number.getBoundingClientRect().left+number.getBoundingClientRect().width/2)-(units.getBoundingClientRect().left+units.getBoundingClientRect().width/2))<.1,'Side numbers and units centered');
    assert(!inspectorRoot.querySelector('.radius-marker') && !inspectorRoot.querySelector('.corner-row'),'No arcs or empty rows for zero radius');
    trigger.style.borderRadius='64px 24px 0 12px';click(trigger);await tick();
    assert(inspectorRoot.querySelectorAll('.radius-marker').length===3,'Arcs only for rounded corners');
    assert(inspectorRoot.querySelector('[data-corner=topLeft]').getAttribute('aria-label')==='topLeft radius: 64px','Actual corner radius label');
    const outside=inspectorRoot.querySelector('.box-margin'),stroke=inspectorRoot.querySelector('.box-stroke');
    assert(getComputedStyle(outside).borderTopLeftRadius==='24px','Visual radius caps at 24px');
    const expectedX=Math.max(2,24-(stroke.getBoundingClientRect().left-outside.getBoundingClientRect().left));
    const expectedY=Math.max(2,24-(stroke.getBoundingClientRect().top-outside.getBoundingClientRect().top));
    const innerRadius=getComputedStyle(stroke).borderTopLeftRadius.split(' ').map(parseFloat);
    assert(Math.abs(innerRadius[0]-expectedX)<.1 && Math.abs((innerRadius[1] || innerRadius[0])-expectedY)<.1,'Inner radii subtract diagram insets');
    assert(parseFloat(getComputedStyle(inspectorRoot.querySelector('.box-center')).borderBottomRightRadius)>=2,'Inner minimum radius 2px');
    trigger.style.borderRadius='0';click(trigger);await tick();
    assert(inspectorRoot.querySelector('.box-center').title.includes('128px × 48px'), 'Content size remains available in the tooltip');
    assert(inspectorRoot.querySelector('.box-center').textContent==='content','Content label follows reference');
    const variableBadge=inspectorRoot.querySelector('.box-padding .box-var');
    assert(variableBadge && variableBadge.getAttribute('aria-label').includes('--space'),'Var badges preserve variable-bearing source expressions');
    variableBadge.dispatchEvent(new Event('pointerenter'));
    assert(!inspectorRoot.querySelector('.box-tooltip').hidden && inspectorRoot.querySelector('.box-tooltip').textContent.includes('--space'),'Hover shows variable details');
    variableBadge.dispatchEvent(new Event('pointerleave'));
    assert(inspectorRoot.querySelector('.box-tooltip').hidden,'Leaving badge hides tooltip');
    trigger.style.transform='scale(2)';click(trigger);await tick();
    const dimensions=inspectorRoot.querySelectorAll('.size-table .table-row');
    assert(dimensions.length===1 && dimensions[0].querySelector('dt').textContent==='size','One size row');
    assert([...dimensions[0].querySelectorAll('.screen-size')].map(n=>n.textContent).join(',')==='360px,200px','Size shows both screen dimensions');
    assert(!inspectorRoot.querySelector('.css-size,.css-size-badge'),'CSS size values are absent');
    const basic=inspectorRoot.querySelector('[data-group=Appearance]');
    assert([...basic.querySelectorAll('dt')].some(n=>n.textContent==='border'),'Uniform border grouped into one parameter');
    assert(![...basic.querySelectorAll('dt')].some(n=>n.textContent==='border-radius'),'Radius stays only in box model');
    trigger.style.transform='';click(trigger);await tick();
    const setUnits=value=>{const select=inspectorRoot.querySelector('.unit-select');select.value=value;select.dispatchEvent(new Event('change',{bubbles:true,composed:true}));};
    setUnits('rem');await tick();
    assert(inspectorRoot.querySelector('.unit-select').value==='rem','Selected unit');
    assert(inspectorRoot.querySelector('.content').textContent.includes('1.5rem'), 'rem conversion');
    assert([...inspectorRoot.querySelectorAll('.table-row')].find(row=>row.querySelector('.color-preview')&&row.querySelector('.token')).querySelector('.value-descriptions').hidden,'New selection resets disclosure');
    trigger.style.borderRadius='8px';click(trigger);await tick();
    assert([...inspectorRoot.querySelectorAll('.radius-marker')].every(marker=>marker.getAttribute('aria-label').endsWith(' radius: 8px')),'Radius labels do not convert with rem display mode');
    trigger.style.borderRadius='0';
    click(document.querySelector('#type-shorthand')); await tick();
    let fontRows=[...inspectorRoot.querySelectorAll('.row')].filter(row=>row.querySelector('dt').textContent==='font');
    assert(fontRows.length===1 && fontRows[0].querySelectorAll('.actual').length===4, 'Shared font shorthand grouped with computed components');
    assert(fontRows[0].querySelector('.token').textContent==='font-ui', 'Font token displayed once without wrapper');
    const background=[...inspectorRoot.querySelectorAll('.row')].find(row=>row.querySelector('dt').textContent==='background-color');
    assert(!background,'Transparent background is hidden even when variable-backed');
    setUnits('auto');
    click(document.querySelector('#type-override')); await tick();
    const weight=[...inspectorRoot.querySelectorAll('.row')].find(row=>row.querySelector('dt').firstChild.textContent==='font-weight');
    assert(weight && weight.querySelector('.token').textContent==='weight-strong', 'Independent font override stays separate');
    assert(weight.querySelector('.override-marker svg') && !weight.querySelector('.override-marker').title,'Replacement icon without override-source tooltip');
    assert([...inspectorRoot.querySelectorAll('.row')].some(row=>row.querySelector('dt').textContent==='font'), 'Remaining shared font properties still grouped after override');
    assert(![...inspectorRoot.querySelectorAll('.row')].some(row=>row.querySelector('dt').textContent==='background-color'),'Transparent background remains hidden in Auto');
    const literalColor=[...inspectorRoot.querySelectorAll('.row')].find(row=>row.querySelector('dt').textContent==='color');
    assert(literalColor.querySelector('.color-preview') && !literalColor.querySelector('.token'),'Literal color values also have previews');
    inspectorRoot.querySelector('.panel').style.width='340px';click(document.querySelector('#alignment'));await tick();
    const alignedRow=[...inspectorRoot.querySelectorAll('.row')].find(row=>row.querySelector('dt').textContent==='color');
    const alignedToken=alignedRow.querySelector('.token').getBoundingClientRect(), alignedPreview=alignedRow.querySelector('.color-preview').getBoundingClientRect();
    assert(alignedToken.height>24,'Long variable wraps over multiple lines');
    assert(Math.abs(alignedPreview.top-alignedToken.top-2)<.1,'Color preview is centered on the first 18px line of a wrapped value');
    assert(Math.abs(alignedRow.querySelector('dt').getBoundingClientRect().top+4-alignedToken.top)<.1,'Parameter and multi-line value start at the same row position');
    const plainValue=[...inspectorRoot.querySelectorAll('.row')].find(row=>row.querySelector('dt').textContent==='letter-spacing').querySelector('dd');
    assert(Math.abs(plainValue.getBoundingClientRect().left+8-alignedToken.left)<.1,'Color-variable text aligns with plain values in the shared text column');
    assert(alignedPreview.right<alignedToken.left && alignedRow.querySelector('.color-preview').parentElement===alignedRow.querySelector('.table-marker'),'Preview has its own column outside the value text');
    assert(getComputedStyle(alignedRow.querySelector('dd')).textAlign==='start','Values align from start');
    for(const width of [340,375,500]){
      panel.style.width=width+'px';await tick();
      const visibleRows=[...inspectorRoot.querySelectorAll('.table-row')].filter(row=>row.getBoundingClientRect().width>0);
      assert(visibleRows.length>5,'Shared template covers size, appearance, layout and typography');
      for(const row of visibleRows){
        const r=row.getBoundingClientRect(),parameter=row.querySelector('.table-parameter').getBoundingClientRect(),value=row.querySelector('.table-value').getBoundingClientRect();
        assert(parameter.width>0 && value.width>0,'Adaptive columns leave room for values');
        assert(value.right<=r.right+.1 && row.scrollWidth<=row.clientWidth+1,'Values stay inside row');
        assert(getComputedStyle(row.querySelector('.table-value')).fontSize==='13px' && getComputedStyle(row.querySelector('.table-value')).lineHeight==='18px','Shared 13/18 typography');
      }
      const valueLeft=visibleRows[0].querySelector('.table-value').getBoundingClientRect().left;
      const labelWidth=visibleRows[0].querySelector('.table-parameter').getBoundingClientRect().width;
      assert(visibleRows.every(row=>Math.abs(row.querySelector('.table-value').getBoundingClientRect().left-valueLeft)<.1 && Math.abs(row.querySelector('.table-parameter').getBoundingClientRect().width-labelWidth)<.1),'All sections use the same column width');
    }
    inspectorRoot.querySelector('.panel').style.width='';
    click(trigger);await tick();
    const use = inspectorRoot.querySelector('[data-mode=use]'); click(use); await tick();
    trigger.focus(); dropdown.hidden = false;
    const inspect = inspectorRoot.querySelector('[data-mode=inspect]'), r = inspect.getBoundingClientRect();
    for (const type of ['pointerdown','mousedown','pointerup','mouseup','click']) {
      inspect.dispatchEvent(new MouseEvent(type,{bubbles:true,composed:true,cancelable:true,clientX:r.left+r.width/2,clientY:r.top+r.height/2}));
    }
    await tick();
    assert(!dropdown.hidden, 'Switch must not reach outside-click listener');
    assert(document.activeElement === trigger, 'Switch must preserve page focus');
    assert(inspect.getAttribute('aria-pressed') === 'true', 'Inspect enabled');
    click(trigger); await tick();
    assert(inspectorRoot.querySelector('.content').textContent.includes('ink'), 'Selection after switching');
    assert(copiedText===undefined,'Inspection never copies variable names implicitly');
    click(inspectorRoot.querySelector('.close'));
    assert(!document.querySelector('design-inspect-overlay'), 'Cleanup');
    document.querySelector('#result').textContent = 'PASS: variables, Auto/rem, dropdown state, focus, mode switch, cleanup';
    document.body.dataset.result = 'pass';
  }
  run().catch(error => {document.querySelector('#result').textContent = error.stack; document.body.dataset.result = 'fail';});
</script>
